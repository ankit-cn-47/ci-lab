---
gitea_version: 28.1.0
gitea_domain: "gitea.{{ lab_domain }}"
gitea_root_url: "https://{{ gitea_domain }}/"
gitea_data_dir: /srv/gitea/data
gitea_http_addr: 127.0.0.1
gitea_http_port: 3000
gitea_ssh_port: 2222

woodpecker_version: 3.19.0
woodpecker_domain: "woodpecker.{{ lab_domain }}"
woodpecker_host_url: "https://{{ woodpecker_domain }}/"
woodpecker_gitea_url: "{{ gitea_root_url | regex_replace('/$', '') }}"
woodpecker_http_addr: 127.0.0.1
woodpecker_http_port: 8000
woodpecker_data_dir: /var/lib/woodpecker
woodpecker_max_workflows: 2

nginx_tls_certificate_dir: /etc/ssl/certs
nginx_tls_private_key_dir: /etc/ssl/private
nginx_tls_certificate_extension: crt
nginx_tls_private_key_extension: key
nginx_gitea_certificate: "{{ nginx_tls_certificate_dir }}/{{ gitea_domain }}.{{ nginx_tls_certificate_extension }}"
nginx_gitea_certificate_key: "{{ nginx_tls_private_key_dir }}/{{ gitea_domain }}.{{ nginx_tls_private_key_extension }}"
nginx_woodpecker_certificate: "{{ nginx_tls_certificate_dir }}/{{ woodpecker_domain }}.{{ nginx_tls_certificate_extension }}"
nginx_woodpecker_certificate_key: "{{ nginx_tls_private_key_dir }}/{{ woodpecker_domain }}.{{ nginx_tls_private_key_extension }}"
