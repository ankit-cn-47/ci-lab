- name: Inspect configured TLS certificate files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ nginx_gitea_certificate }}"
    - "{{ nginx_gitea_certificate_key }}"
    - "{{ nginx_woodpecker_certificate }}"
    - "{{ nginx_woodpecker_certificate_key }}"
  register: nginx_certificate_stats

- name: Validate TLS certificate paths
  ansible.builtin.assert:
    that:
      - nginx_certificate_stats.results[0].stat.exists
      - nginx_certificate_stats.results[1].stat.exists
      - nginx_certificate_stats.results[2].stat.exists
      - nginx_certificate_stats.results[3].stat.exists
    fail_msg: >-
      Set the Gitea and Woodpecker TLS certificate and key paths to files
      present on the VM in group_vars/ci.yml.

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Nginx reverse proxies
  ansible.builtin.template:
    src: ci.conf.j2
    dest: /etc/nginx/sites-available/ci.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Validate Nginx
    - Reload Nginx

- name: Enable CI Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ci.conf
    dest: /etc/nginx/sites-enabled/ci.conf
    state: link
  notify:
    - Validate Nginx
    - Reload Nginx

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - Validate Nginx
    - Reload Nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
