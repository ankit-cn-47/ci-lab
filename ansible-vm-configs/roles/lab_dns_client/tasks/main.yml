---
- name: Require systemd-resolved on the KVM host
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == 'systemd'
    fail_msg: This DNS client role requires systemd-resolved on the KVM host.

- name: Configure split DNS routing for the lab zone
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Route the lab DNS zone to the lab DNS VM
  ansible.builtin.template:
    src: lab-dns.conf.j2
    dest: /etc/systemd/resolved.conf.d/10-lab-dns.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

- name: Enable and start systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: true
    state: started
